name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash gradlew :ext:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: echo-bilibili-audio-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: echo-bilibili-audio-apk
          path: dist
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^extVersion=//p' gradle.properties | head -n 1)"
          test -n "$version"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; increase extVersion for a new release."
            exit 1
          fi
          asset="dist/echo-bilibili-audio-$version.apk"
          mv dist/app-debug.apk "$asset"
          gh release create "$version" "$asset" \
            --title "Bilibili Audio $version Stable" \
            --notes-file RELEASE_NOTES.md --latest
